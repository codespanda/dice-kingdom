<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2a1f3d" />
  <meta name="description" content="Play Ludo online with friends using a room ID, or against the computer." />
  <title>Ludo Online</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='32' height='32' fill='%23e5484d'/%3E%3Crect x='32' width='32' height='32' fill='%232fa46c'/%3E%3Crect x='32' y='32' width='32' height='32' fill='%23f2b10c'/%3E%3Crect y='32' width='32' height='32' fill='%233e7bfa'/%3E%3Ccircle cx='32' cy='32' r='12' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/ludo-hd/assets/index-uPzY8mYV.js"></script>
  <link rel="stylesheet" crossorigin href="/ludo-hd/assets/index-CwuG_jnh.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <main id="app">
    <section id="menu" class="screen">
      <div class="menu-inner">
        <a class="home-link" href="https://games.codespanda.com/">&larr; All games</a>
        <div class="hero">
          <div class="hero-art" aria-hidden="true">
            <div class="mini-board"><i class="r"></i><i class="g"></i><i class="b"></i><i class="y"></i><b></b></div>
            <div class="die die-a"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="die die-b"><i></i><i></i><i></i></div>
          </div>
          <h1 class="logo">LUDO</h1>
          <p class="tagline">Roll, race and capture with friends online or against the computer.</p>
        </div>
        <label class="field name-field">
          <span class="avatar" id="nameAvatar">P</span>
          <input id="nameInput" maxlength="16" autocomplete="nickname" placeholder="Enter your name" aria-label="Your name" />
        </label>
        <div class="card mode-card">
          <div class="card-head">
            <span class="card-icon robot"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="4" fill="currentColor"/><circle cx="9" cy="13" r="1.8" fill="#2a1f3d"/><circle cx="15" cy="13" r="1.8" fill="#2a1f3d"/><rect x="11" y="3" width="2" height="4" rx="1" fill="currentColor"/><circle cx="12" cy="3" r="1.6" fill="currentColor"/></svg></span>
            <div><h2>Play vs computer</h2><p class="muted small">Practice against smart AI opponents</p></div>
          </div>
          <div class="seg" id="botCount" role="radiogroup" aria-label="Number of computer opponents">
            <button data-n="1">1 opponent</button>
            <button data-n="2">2 opponents</button>
            <button data-n="3" class="on">3 opponents</button>
          </div>
          <button id="playBots" class="btn primary big">Play now</button>
        </div>
        <div class="card mode-card">
          <div class="card-head">
            <span class="card-icon globe"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
            <div><h2>Play online</h2><p class="muted small">Invite friends with a room ID</p></div>
          </div>
          <button id="createRoom" class="btn secondary big">Create a room</button>
          <div class="join-row">
            <input id="codeInput" maxlength="6" placeholder="ROOM ID" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room ID" />
            <button id="joinRoom" class="btn">Join</button>
          </div>
        </div>
        <button id="howBtn" class="btn ghost">How to play</button>
      </div>
    </section>

    <section id="lobby" class="screen hidden">
      <div class="menu-inner">
        <div class="code-card">
          <p class="eyebrow">Room ID</p>
          <div class="room-code" id="lobbyCode">------</div>
          <div class="share-row">
            <button id="copyCode" class="btn small">Copy ID</button>
            <button id="shareLink" class="btn small">Share invite link</button>
          </div>
        </div>
        <div class="card">
          <h2>Players <span id="seatCount" class="muted"></span></h2>
          <ul id="seatList" class="seats"></ul>
          <button id="addBot" class="btn">+ Add computer player</button>
        </div>
        <button id="startGame" class="btn primary big">Start game</button>
        <p id="lobbyHint" class="muted center"></p>
        <button id="leaveLobby" class="btn ghost">Leave room</button>
      </div>
    </section>

    <section id="game" class="screen hidden">
      <header class="hud">
        <button id="exitGame" class="icon-btn" aria-label="Leave game"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
        <div id="playerBar" class="player-bar"></div>
        <div class="hud-spacer"></div>
      </header>
      <div id="turnInfo" class="turn-info"><span class="dot"></span><span class="txt"></span><span id="roomTag" class="room-tag"></span></div>
      <div id="stage"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box" id="modalBox"></div>
  </div>
  <div id="audioBtns" class="audio-btns">
    <button id="musicBtn" class="icon-btn" aria-label="Toggle music"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 17.5a3 3 0 1 1-2-2.83V5.5l12-2.5v11.5a3 3 0 1 1-2-2.83V7.4L9 9.07z"/></svg></button>
    <button id="sfxBtn" class="icon-btn" aria-label="Toggle sound effects"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
  </div>
  <div id="toast" class="toast"></div>
</body>
</html>
